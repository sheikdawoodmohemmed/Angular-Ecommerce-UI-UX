<a class="product-card card" [routerLink]="['/product', product.id]">
  <div class="thumb">
    <span class="emoji">{{ product.image }}</span>
    @if (product.badge === 'sale') {
      <span class="badge badge-sale corner">Sale</span>
    } @else if (product.badge === 'new') {
      <span class="badge badge-new corner">New</span>
    }
    <button class="wishlist-btn" [class.active]="wishlisted()" (click)="toggleWishlist($event)" aria-label="Wishlist">
      <svg width="18" height="18" viewBox="0 0 24 24" [attr.fill]="wishlisted() ? 'currentColor' : 'none'">
        <path d="M12 21s-7.5-4.6-10-9.1C.5 8.5 2 4.5 6 4.5c2 0 3.5 1 6 3.5 2.5-2.5 4-3.5 6-3.5 4 0 5.5 4 4 7.4-2.5 4.5-10 9.1-10 9.1Z" stroke="currentColor" stroke-width="1.6"/>
      </svg>
    </button>
  </div>

  <div class="info">
    <span class="category">{{ product.category }}</span>
    <h3 class="name">{{ product.name }}</h3>

    <div class="rating">
      @for (s of stars(); track s) {
        <svg width="13" height="13" viewBox="0 0 24 24" [attr.fill]="s <= product.rating ? '#fbbf24' : '#e7e2ee'">
          <path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/>
        </svg>
      }
      <small>({{ product.reviews }})</small>
    </div>

    <div class="price-row">
      <span class="price">${{ product.price.toFixed(2) }}</span>
      @if (product.oldPrice) {
        <span class="old-price">${{ product.oldPrice.toFixed(2) }}</span>
      }
    </div>
  </div>

  <button class="add-btn" [class.added]="justAdded()" (click)="onAdd($event)">
    @if (justAdded()) {
      Added ✓
    } @else {
      + Add to Cart
    }
  </button>
</a>
